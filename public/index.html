<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102027">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tienda">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Sistema de Tienda</title>
  <style>
    :root {
      --bg: #eef3f6;
      --panel: #ffffff;
      --ink: #172026;
      --muted: #657481;
      --line: #dbe4ea;
      --accent: #0f766e;
      --accent-dark: #0b4f4a;
      --accent-2: #1d4ed8;
      --danger: #b42318;
      --warning: #b45309;
      --success: #14804a;
      --soft: #e9f7f4;
      --soft-blue: #edf4ff;
      --shadow: 0 18px 50px rgba(15, 34, 45, .12);
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, .16), transparent 34%),
        linear-gradient(180deg, #f8fbfc 0%, var(--bg) 45%, #e8eef2 100%);
      color: var(--ink);
    }

    header {
      background:
        linear-gradient(135deg, #102027 0%, #12383c 52%, #0f766e 100%);
      color: #fff;
      padding: 24px clamp(16px, 4vw, 42px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 14px 32px rgba(16, 32, 39, .22);
    }

    h1, h2, h3, p {
      margin: 0;
    }

    h1 {
      font-size: clamp(26px, 4vw, 38px);
      letter-spacing: 0;
      line-height: 1;
      margin-bottom: 8px;
    }

    header p {
      color: rgba(255, 255, 255, .76);
      font-size: 14px;
    }

    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      min-width: 0;
      overflow: hidden;
    }

    .panel-head {
      padding: 18px 18px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbfc 100%);
    }

    .panel-head h2 {
      font-size: 18px;
      line-height: 1.1;
    }

    .panel-body {
      padding: 18px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      align-items: end;
      margin-bottom: 16px;
      padding: 14px;
      border: 1px solid #e7eef3;
      border-radius: 12px;
      background: #f8fbfc;
    }

    .toolbar .wide {
      grid-column: span 2;
    }

    .toolbar .form-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
      font-weight: 700;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--ink);
      background: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color .16s ease, box-shadow .16s ease;
    }

    input:focus, select:focus {
      border-color: rgba(15, 118, 110, .55);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, .12);
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(15, 118, 110, .2);
      transition: transform .14s ease, filter .14s ease, box-shadow .14s ease;
    }

    button:hover {
      filter: brightness(.96);
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(15, 118, 110, .24);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 5px 12px rgba(15, 118, 110, .18);
    }

    button:disabled {
      cursor: not-allowed;
      filter: grayscale(.1);
      opacity: .55;
      transform: none;
      box-shadow: none;
    }

    button.secondary {
      background: #edf2f6;
      color: var(--ink);
      border: 1px solid #dce6ec;
      box-shadow: none;
    }

    button.blue {
      background: linear-gradient(180deg, #2563eb 0%, var(--accent-2) 100%);
      box-shadow: 0 10px 24px rgba(37, 99, 235, .22);
    }

    button.danger {
      background: linear-gradient(180deg, #dc2626 0%, var(--danger) 100%);
      box-shadow: none;
    }

    .icon-btn {
      width: 42px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-size: 20px;
      line-height: 1;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr 160px auto auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 13px 12px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      background: #f6fafc;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tbody tr {
      transition: background .14s ease;
    }

    tbody tr:hover {
      background: #f8fbfc;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .stock-low {
      color: var(--warning);
      font-weight: 700;
    }

    .cart-list {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .cart-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      background: #fbfdfe;
    }

    .cart-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .cart-item small {
      color: var(--muted);
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty button {
      width: 32px;
      min-height: 32px;
      padding: 0;
      background: #e7eff4;
      color: var(--ink);
      box-shadow: none;
    }

    .qty span {
      min-width: 24px;
      text-align: center;
      font-weight: 700;
    }

    .totals {
      background: linear-gradient(135deg, var(--soft) 0%, var(--soft-blue) 100%);
      border: 1px solid #cbe7e2;
      border-radius: 12px;
      padding: 16px;
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .total-row.grand {
      font-size: 24px;
      font-weight: 800;
      color: var(--accent-dark);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      background: linear-gradient(180deg, #ffffff 0%, #f8fbfc 100%);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .stat strong {
      font-size: 22px;
    }

    .history {
      max-height: 300px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 22px 8px;
    }

    .actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .row-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .scanner-modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(8, 19, 26, .56);
      backdrop-filter: blur(8px);
    }

    .scanner-modal.open {
      display: flex;
    }

    .scanner-card {
      width: min(560px, 100%);
      max-height: min(92vh, 860px);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(8, 19, 26, .34);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .scanner-head {
      padding: 14px 16px;
      color: #fff;
      background: #102027;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .scanner-head p {
      margin-top: 4px;
      color: rgba(255, 255, 255, .74);
      font-size: 13px;
    }

    .scanner-close {
      width: 36px;
      min-height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .14);
      box-shadow: none;
    }

    .scanner-body {
      padding: 0;
      display: grid;
      gap: 0;
      overflow: auto;
    }

    .scanner-video {
      width: 100%;
      height: min(48vh, 390px);
      background: #102027;
      object-fit: cover;
    }

    .scanner-result {
      min-height: 44px;
      border-bottom: 1px solid var(--line);
      background: #f8fbfc;
      padding: 12px 16px;
      color: var(--muted);
      line-height: 1.45;
    }

    .scanner-sale-panel {
      padding: 16px;
      display: grid;
      gap: 14px;
      background: #fff;
    }

    .scanner-total {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .scanner-total span {
      color: var(--muted);
      font-size: 13px;
    }

    .scanner-total strong {
      display: block;
      margin-top: 4px;
      font-size: 28px;
      color: var(--accent-dark);
      line-height: 1;
    }

    .scanner-mini-list {
      display: grid;
      gap: 8px;
      min-height: 96px;
      max-height: 190px;
      overflow: auto;
    }

    .scanner-mini-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fbfdfe;
    }

    .scanner-mini-item small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
    }

    .scanner-mini-item strong:last-child {
      color: var(--accent-dark);
    }

    .scanner-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .scanner-actions .wide {
      grid-column: 1 / -1;
    }

    .scanner-torch {
      width: 100%;
    }

    .receipt-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(8, 19, 26, .5);
      backdrop-filter: blur(8px);
    }

    .receipt-modal.open {
      display: flex;
    }

    .receipt-card {
      width: min(460px, 100%);
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(8, 19, 26, .3);
      overflow: hidden;
    }

    .receipt-head {
      padding: 18px;
      color: #fff;
      background: linear-gradient(135deg, #102027 0%, #0f766e 100%);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .receipt-close {
      width: 36px;
      min-height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .14);
      box-shadow: none;
    }

    .receipt-body {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .receipt-paper {
      border: 1px dashed #c8d5dd;
      border-radius: 12px;
      padding: 16px;
      background: #fbfdfe;
      color: #172026;
    }

    .receipt-paper h3 {
      text-align: center;
      margin-bottom: 4px;
    }

    .receipt-meta {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      margin-bottom: 14px;
    }

    .receipt-line {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #e7eef3;
      font-size: 14px;
    }

    .receipt-line small {
      color: var(--muted);
      display: block;
      margin-top: 3px;
    }

    .receipt-total {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 14px;
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-dark);
    }

    .receipt-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .receipt-actions a {
      min-height: 42px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);
      font-weight: 700;
      text-decoration: none;
    }

    aside {
      position: sticky;
      top: 18px;
    }

    @media (max-width: 940px) {
      main {
        grid-template-columns: 1fr;
      }

      aside {
        position: static;
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .toolbar .wide, .toolbar .form-actions {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 620px) {
      header {
        padding: 16px;
      }

      main {
        padding: 14px;
      }

      .toolbar, .search-row, .stats {
        grid-template-columns: 1fr;
      }

      .receipt-actions {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 13px;
      }

      th:nth-child(3), td:nth-child(3) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Mi Tienda</h1>
      <p id="today"></p>
    </div>
    <div class="header-actions">
      <button class="secondary" id="resetBtn">Reiniciar datos</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h2>Inventario</h2>
        <div class="actions">
          <button class="secondary" id="exportBtn">Exportar CSV</button>
        </div>
      </div>
      <div class="panel-body">
        <form class="toolbar" id="productForm">
          <div class="wide">
            <label for="name">Producto</label>
            <input id="name" required placeholder="Ej. Arroz 1 kg">
          </div>
          <div>
            <label for="category">Categoría</label>
            <input id="category" placeholder="Abarrotes">
          </div>
          <div>
            <label for="price">Precio S/</label>
            <input id="price" required type="number" min="0" step="0.10" placeholder="0.00">
          </div>
          <div>
            <label for="stock">Stock</label>
            <input id="stock" required type="number" min="0" step="1" placeholder="0">
          </div>
          <div class="wide">
            <label for="barcode">Código de barras</label>
            <input id="barcode" inputmode="numeric" autocomplete="off" placeholder="Escanea o escribe el código">
          </div>
          <div class="form-actions">
            <button class="secondary" id="scanRegisterBtn" type="button">Escanear código</button>
            <button class="icon-btn" title="Agregar producto" aria-label="Agregar producto">+</button>
          </div>
        </form>

        <div class="search-row">
          <input id="search" placeholder="Buscar producto">
          <select id="categoryFilter" aria-label="Filtrar por categoría">
            <option value="">Todas las categorías</option>
          </select>
          <button class="blue" id="scanSaleBtn" type="button">Escanear venta</button>
          <button class="secondary" id="emptyStockBtn" type="button">Lista sin stock</button>
        </div>

        <div class="history">
          <table>
            <thead>
              <tr>
                <th>Producto</th>
                <th>Categoría</th>
                <th class="num">Stock</th>
                <th class="num">Precio</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="productRows"></tbody>
          </table>
        </div>
      </div>
    </section>

    <aside>
      <section class="panel">
        <div class="panel-head">
          <h2>Venta</h2>
          <button class="secondary" id="clearCartBtn">Vaciar</button>
        </div>
        <div class="panel-body">
          <div class="cart-list" id="cartList"></div>
          <div class="totals">
            <div class="total-row"><span>Productos</span><strong id="itemCount">0</strong></div>
            <div class="total-row grand"><span>Total</span><span id="cartTotal">S/ 0.00</span></div>
          </div>
          <button class="blue" id="checkoutBtn" style="width:100%">Registrar venta</button>
        </div>
      </section>

    </aside>
  </main>

  <div class="scanner-modal" id="scannerModal" aria-hidden="true">
    <section class="scanner-card" role="dialog" aria-modal="true" aria-labelledby="scannerTitle">
      <div class="scanner-head">
        <div>
          <h2 id="scannerTitle">Escanear código</h2>
          <p>Apunta la cámara al código de barras del producto.</p>
        </div>
        <button class="scanner-close" id="scannerClose" type="button" aria-label="Cerrar">x</button>
      </div>
      <div class="scanner-body">
        <video class="scanner-video" id="scannerVideo" muted playsinline></video>
        <div class="scanner-result" id="scannerResult">Preparando cámara...</div>
        <button class="secondary scanner-torch" id="scannerTorch" type="button" hidden>Encender flash</button>
        <div class="scanner-sale-panel" id="scannerSalePanel">
          <div class="scanner-total">
            <div>
              <h3>Artículos</h3>
              <span id="scannerItemCount">0 items</span>
            </div>
            <div>
              <span>Total</span>
              <strong id="scannerTotal">S/ 0.00</strong>
            </div>
          </div>
          <div class="scanner-mini-list" id="scannerCartList"></div>
          <div class="scanner-actions">
            <button class="secondary" id="scannerAddProduct" type="button" hidden>Agregar producto</button>
            <button class="secondary" id="scannerRetry" type="button">Reactivar cámara</button>
            <button class="blue wide" id="scannerCheckout" type="button">Registrar venta</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="receipt-modal" id="receiptModal" aria-hidden="true">
    <section class="receipt-card" role="dialog" aria-modal="true" aria-labelledby="receiptTitle">
      <div class="receipt-head">
        <div>
          <h2 id="receiptTitle">Boleta generada</h2>
          <p>Lista para imprimir o enviar por WhatsApp.</p>
        </div>
        <button class="receipt-close" id="receiptClose" type="button" aria-label="Cerrar">x</button>
      </div>
      <div class="receipt-body">
        <div class="receipt-paper" id="receiptPaper"></div>
        <div class="receipt-actions">
          <button id="receiptPrint" type="button">Imprimir</button>
          <a id="receiptWhatsapp" target="_blank" rel="noopener">WhatsApp</a>
        </div>
      </div>
    </section>
  </div>

  <script>
    const money = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' });
    const dateFmt = new Intl.DateTimeFormat('es-PE', { dateStyle: 'full', timeStyle: 'short' });
    const storeKey = 'tienda.simple.v1';

    const makeId = () => {
      if (globalThis.crypto && globalThis.crypto.randomUUID) return globalThis.crypto.randomUUID();
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    };

    const starterProducts = [
      { id: makeId(), name: 'Arroz 1 kg', category: 'Abarrotes', price: 4.8, stock: 25, barcode: '7750001000013' },
      { id: makeId(), name: 'Azúcar 1 kg', category: 'Abarrotes', price: 4.2, stock: 18, barcode: '7750001000020' },
      { id: makeId(), name: 'Aceite 900 ml', category: 'Cocina', price: 8.9, stock: 12, barcode: '7750001000037' },
      { id: makeId(), name: 'Jabón de ropa', category: 'Limpieza', price: 3.5, stock: 20, barcode: '7750001000044' }
    ];

    const usesSharedDatabase = location.protocol === 'http:' || location.protocol === 'https:';
    let state = { products: starterProducts, sales: [] };
    let cart = [];
    let showingEmptyStock = false;
    let scannerMode = 'sale';
    let scannerStream = null;
    let scannerDetector = null;
    let scannerActive = false;
    let scannerFrame = 0;
    let scannerLastCode = '';
    let scannerLastAt = 0;
    let scannerTorchOn = false;

    const els = {
      today: document.querySelector('#today'),
      productForm: document.querySelector('#productForm'),
      name: document.querySelector('#name'),
      category: document.querySelector('#category'),
      price: document.querySelector('#price'),
      stock: document.querySelector('#stock'),
      barcode: document.querySelector('#barcode'),
      scanRegisterBtn: document.querySelector('#scanRegisterBtn'),
      scanSaleBtn: document.querySelector('#scanSaleBtn'),
      search: document.querySelector('#search'),
      categoryFilter: document.querySelector('#categoryFilter'),
      emptyStockBtn: document.querySelector('#emptyStockBtn'),
      productRows: document.querySelector('#productRows'),
      cartList: document.querySelector('#cartList'),
      itemCount: document.querySelector('#itemCount'),
      cartTotal: document.querySelector('#cartTotal'),
      checkoutBtn: document.querySelector('#checkoutBtn'),
      clearCartBtn: document.querySelector('#clearCartBtn'),
      exportBtn: document.querySelector('#exportBtn'),
      resetBtn: document.querySelector('#resetBtn'),
      scannerModal: document.querySelector('#scannerModal'),
      scannerClose: document.querySelector('#scannerClose'),
      scannerTitle: document.querySelector('#scannerTitle'),
      scannerVideo: document.querySelector('#scannerVideo'),
      scannerResult: document.querySelector('#scannerResult'),
      scannerTorch: document.querySelector('#scannerTorch'),
      scannerRetry: document.querySelector('#scannerRetry'),
      scannerSalePanel: document.querySelector('#scannerSalePanel'),
      scannerCartList: document.querySelector('#scannerCartList'),
      scannerItemCount: document.querySelector('#scannerItemCount'),
      scannerTotal: document.querySelector('#scannerTotal'),
      scannerAddProduct: document.querySelector('#scannerAddProduct'),
      scannerCheckout: document.querySelector('#scannerCheckout'),
      receiptModal: document.querySelector('#receiptModal'),
      receiptClose: document.querySelector('#receiptClose'),
      receiptPaper: document.querySelector('#receiptPaper'),
      receiptPrint: document.querySelector('#receiptPrint'),
      receiptWhatsapp: document.querySelector('#receiptWhatsapp')
    };

    function normalizeBarcode(value) {
      return String(value || '').replace(/[^0-9A-Za-z]/g, '').toUpperCase();
    }

    function normalizeState(rawState) {
      const source = rawState && Array.isArray(rawState.products) ? rawState.products : starterProducts;
      return {
        products: source.map(product => ({
          ...product,
          barcode: normalizeBarcode(product.barcode)
        })),
        sales: rawState && Array.isArray(rawState.sales) ? rawState.sales : []
      };
    }

    function findProductByBarcode(code) {
      const target = normalizeBarcode(code);
      if (!target) return null;
      return state.products.find(product => normalizeBarcode(product.barcode) === target) || null;
    }

    let sharedRevision = '';
    let savedSnapshot = '';
    let saving = false;
    async function loadState() {
      if (usesSharedDatabase) {
        try {
          const response = await fetch('/api/state', { cache: 'no-store' });
          if (response.ok) {
            sharedRevision = response.headers.get('x-store-revision') || '';
            const loaded = normalizeState(await response.json());
            localStorage.setItem(storeKey, JSON.stringify(loaded));
            return loaded;
          }
        } catch {}
      }
      const saved = localStorage.getItem(storeKey);
      if (!saved) return normalizeState({ products: starterProducts, sales: [] });
      try {
        return normalizeState(JSON.parse(saved));
      } catch {
        return normalizeState({ products: starterProducts, sales: [] });
      }
    }

    async function saveState() {
      const snapshot = JSON.stringify(state);
      if (snapshot === savedSnapshot) return true;
      if (saving) return false;
      saving = true;
      if (usesSharedDatabase) {
        try {
          if (!sharedRevision && !['localhost', '127.0.0.1'].includes(location.hostname)) throw new Error('Sin conexion con la base de datos. Conectate a internet e intenta nuevamente.');
          const response = await fetch('/api/state', {
            method: 'PUT',
            headers: { 'content-type': 'application/json', 'if-match': sharedRevision },
            body: snapshot
          });
          if (!response.ok) throw new Error(response.status === 409 ? 'Otro celular modifico la tienda. Tu cambio no se guardo; intenta nuevamente.' : 'No se pudo guardar. Revisa tu conexion e intenta nuevamente.');
          sharedRevision = response.headers.get('x-store-revision') || sharedRevision;
        } catch (error) {
          state = normalizeState(JSON.parse(savedSnapshot));
          saving = false;
          alert(error.message);
          await refreshSharedState();
          render();
          return false;
        }
      }
      localStorage.setItem(storeKey, snapshot);
      savedSnapshot = snapshot;
      saving = false;
      return true;
    }

    async function render() {
      const saved = await saveState();
      els.today.textContent = dateFmt.format(new Date());
      renderCategories();
      renderProducts();
      renderCart();
      return saved;
    }

    async function refreshSharedState() {
      if (!usesSharedDatabase || saving || document.hidden) return;
      const previousSnapshot = savedSnapshot;
      try {
        const response = await fetch('/api/state', { cache: 'no-store' });
        if (!response.ok) return;
        const loaded = normalizeState(await response.json());
        if (saving || savedSnapshot !== previousSnapshot || JSON.stringify(state) !== savedSnapshot) return;
        sharedRevision = response.headers.get('x-store-revision') || '';
        state = loaded;
        savedSnapshot = JSON.stringify(state);
        localStorage.setItem(storeKey, savedSnapshot);
        cart = cart.filter(item => state.products.some(p => p.id === item.id && p.stock >= item.qty));
        render();
      } catch {}
    }

    function renderCategories() {
      const current = els.categoryFilter.value;
      const categories = [...new Set(state.products.map(p => p.category).filter(Boolean))].sort();
      els.categoryFilter.innerHTML = '<option value="">Todas las categorías</option>' +
        categories.map(cat => `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`).join('');
      els.categoryFilter.value = categories.includes(current) ? current : '';
    }

    function renderProducts() {
      const term = els.search.value.trim().toLowerCase();
      const category = els.categoryFilter.value;
      const products = state.products
        .filter(p => !term || p.name.toLowerCase().includes(term) || p.category.toLowerCase().includes(term) || normalizeBarcode(p.barcode).toLowerCase().includes(term))
        .filter(p => !category || p.category === category)
        .filter(p => !showingEmptyStock || p.stock === 0)
        .sort((a, b) => a.name.localeCompare(b.name));
      els.emptyStockBtn.textContent = showingEmptyStock ? 'Ver todos' : 'Lista sin stock';

      if (!products.length) {
        const message = showingEmptyStock ? 'No hay productos sin stock.' : 'No hay productos para mostrar.';
        els.productRows.innerHTML = `<tr><td class="empty" colspan="5">${message}</td></tr>`;
        return;
      }

      els.productRows.innerHTML = products.map(product => `
        <tr>
          <td><strong>${escapeHtml(product.name)}</strong>${product.barcode ? `<br><small>${escapeHtml(product.barcode)}</small>` : ''}</td>
          <td>${escapeHtml(product.category || 'Sin categoría')}</td>
          <td class="num ${product.stock <= 5 ? 'stock-low' : ''}">${product.stock}</td>
          <td class="num">${money.format(product.price)}</td>
          <td class="num">
            <div class="row-actions">
              <button class="icon-btn" title="Agregar a venta" aria-label="Agregar ${escapeHtml(product.name)}" onclick="addToCart('${product.id}')">+</button>
              <button class="icon-btn danger" title="Borrar producto" aria-label="Borrar ${escapeHtml(product.name)}" onclick="deleteProduct('${product.id}')">x</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function renderCart() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      const total = cart.reduce((sum, item) => {
        const product = state.products.find(p => p.id === item.id);
        return sum + (product ? product.price * item.qty : 0);
      }, 0);

      if (!cart.length) {
        els.cartList.innerHTML = '<div class="empty">Agrega productos desde el inventario.</div>';
      } else {
        els.cartList.innerHTML = cart.map(item => {
          const product = state.products.find(p => p.id === item.id);
          if (!product) return '';
          return `
            <div class="cart-item">
              <div>
                <strong>${escapeHtml(product.name)}</strong>
                <small>${money.format(product.price)} x ${item.qty}</small>
              </div>
              <div class="qty">
                <button onclick="changeQty('${item.id}', -1)" aria-label="Quitar uno">-</button>
                <span>${item.qty}</span>
                <button onclick="changeQty('${item.id}', 1)" aria-label="Agregar uno">+</button>
              </div>
            </div>
          `;
        }).join('');
      }

      els.itemCount.textContent = count;
      els.cartTotal.textContent = money.format(total);
      els.checkoutBtn.disabled = cart.length === 0;
      renderScannerSalePanel(count, total);
    }

    function renderScannerSalePanel(count, total) {
      els.scannerItemCount.textContent = `${count} ${count === 1 ? 'item' : 'items'}`;
      els.scannerTotal.textContent = money.format(total);
      els.scannerCheckout.disabled = cart.length === 0 || saving;

      if (!cart.length) {
        els.scannerCartList.innerHTML = '<div class="empty">Los productos escaneados aparecerán aquí.</div>';
        return;
      }

      els.scannerCartList.innerHTML = cart.map(item => {
        const product = state.products.find(p => p.id === item.id);
        if (!product) return '';
        return `
          <div class="scanner-mini-item">
            <div>
              <strong>${escapeHtml(product.name)}</strong>
              <small>${money.format(product.price)} x ${item.qty}</small>
            </div>
            <strong>${money.format(product.price * item.qty)}</strong>
          </div>
        `;
      }).join('');
    }

    function addToCart(id) {
      const product = state.products.find(p => p.id === id);
      if (!product || product.stock <= 0) return;
      const item = cart.find(i => i.id === id);
      const qtyInCart = item ? item.qty : 0;
      if (qtyInCart >= product.stock) return;
      if (item) item.qty += 1;
      else cart.push({ id, qty: 1 });
      renderCart();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      const product = state.products.find(p => p.id === id);
      if (!item || !product) return;
      item.qty = Math.max(0, Math.min(product.stock, item.qty + delta));
      cart = cart.filter(i => i.qty > 0);
      renderCart();
    }

    function deleteProduct(id) {
      if (saving) return;
      const product = state.products.find(p => p.id === id);
      if (!product) return;
      if (!confirm(`¿Borrar "${product.name}" del inventario?`)) return;
      state.products = state.products.filter(p => p.id !== id);
      cart = cart.filter(item => item.id !== id);
      render();
    }

    function receiptNumber(sale) {
      return `B-${String(sale.id || '').slice(-6).toUpperCase()}`;
    }

    function receiptText(sale) {
      const date = new Date(sale.date);
      const lines = [
        'MI TIENDA',
        `Boleta: ${receiptNumber(sale)}`,
        `Fecha: ${date.toLocaleString('es-PE')}`,
        '',
        'Detalle:'
      ];

      sale.items.forEach(item => {
        lines.push(`${item.qty} x ${item.name} - ${money.format(item.price * item.qty)}`);
      });

      lines.push('', `TOTAL: ${money.format(sale.total)}`, '', 'Gracias por su compra.');
      return lines.join('\n');
    }

    function receiptHtml(sale) {
      const date = new Date(sale.date);
      const rows = sale.items.map(item => `
        <div class="receipt-line">
          <div>
            <strong>${escapeHtml(item.name)}</strong>
            <small>${item.qty} x ${money.format(item.price)}</small>
          </div>
          <strong>${money.format(item.price * item.qty)}</strong>
        </div>
      `).join('');

      return `
        <h3>Mi Tienda</h3>
        <div class="receipt-meta">
          <div>Boleta ${receiptNumber(sale)}</div>
          <div>${date.toLocaleString('es-PE')}</div>
        </div>
        ${rows}
        <div class="receipt-total">
          <span>Total</span>
          <span>${money.format(sale.total)}</span>
        </div>
      `;
    }

    function showReceipt(sale) {
      els.receiptPaper.innerHTML = receiptHtml(sale);
      els.receiptWhatsapp.href = `https://wa.me/?text=${encodeURIComponent(receiptText(sale))}`;
      els.receiptModal.classList.add('open');
      els.receiptModal.setAttribute('aria-hidden', 'false');
    }

    function closeReceipt() {
      els.receiptModal.classList.remove('open');
      els.receiptModal.setAttribute('aria-hidden', 'true');
    }

    function printReceipt() {
      const printWindow = window.open('', '_blank', 'width=420,height=720');
      if (!printWindow) {
        window.print();
        return;
      }

      printWindow.document.write(`
        <!doctype html>
        <html>
        <head>
          <meta charset="utf-8">
          <title>Boleta</title>
          <style>
            body { font-family: Arial, sans-serif; margin: 24px; color: #172026; }
            .receipt-paper { max-width: 320px; margin: 0 auto; }
            h3 { text-align: center; margin: 0 0 4px; }
            .receipt-meta { color: #657481; font-size: 12px; text-align: center; margin-bottom: 14px; }
            .receipt-line { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid #dbe4ea; font-size: 14px; }
            small { color: #657481; display: block; margin-top: 3px; }
            .receipt-total { display: flex; justify-content: space-between; padding-top: 14px; font-size: 20px; font-weight: 800; }
          </style>
        </head>
        <body><div class="receipt-paper">${els.receiptPaper.innerHTML}</div></body>
        </html>
      `);
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
    }

    async function registerCurrentSale() {
      if (saving) return;
      if (!cart.length) return;
      const items = cart.map(item => {
        const product = state.products.find(p => p.id === item.id);
        return { id: item.id, name: product.name, qty: item.qty, price: product.price };
      });
      const total = items.reduce((sum, item) => sum + item.price * item.qty, 0);
      for (const item of cart) {
        const product = state.products.find(p => p.id === item.id);
        product.stock -= item.qty;
      }
      const sale = { id: makeId(), date: new Date().toISOString(), items, total };
      state.sales.unshift(sale);
      cart = [];
      if (await render()) {
        closeScanner();
        showReceipt(sale);
      }
    }

    function setScannerResult(message, isError = false) {
      els.scannerResult.textContent = message;
      els.scannerResult.style.color = isError ? 'var(--danger)' : 'var(--muted)';
    }

    function showScannerAddOption(code) {
      els.barcode.value = code;
      els.scannerAddProduct.hidden = false;
      els.scannerAddProduct.textContent = `Agregar producto ${code}`;
    }

    function hideScannerAddOption() {
      els.scannerAddProduct.hidden = true;
      els.scannerAddProduct.textContent = 'Agregar producto';
    }

    function setupScannerTorch() {
      const track = scannerStream?.getVideoTracks()[0];
      const supportsTorch = Boolean(track?.getCapabilities?.().torch);
      scannerTorchOn = false;
      els.scannerTorch.hidden = !supportsTorch;
      els.scannerTorch.textContent = 'Encender flash';
    }

    async function toggleScannerTorch() {
      const track = scannerStream?.getVideoTracks()[0];
      if (!track?.applyConstraints) return;
      try {
        scannerTorchOn = !scannerTorchOn;
        await track.applyConstraints({ advanced: [{ torch: scannerTorchOn }] });
        els.scannerTorch.textContent = scannerTorchOn ? 'Apagar flash' : 'Encender flash';
      } catch {
        scannerTorchOn = false;
        els.scannerTorch.hidden = true;
        setScannerResult('Esta cámara no permite controlar el flash desde el navegador.', true);
      }
    }

    function stopScannerCamera() {
      scannerActive = false;
      cancelAnimationFrame(scannerFrame);
      if (scannerStream) {
        scannerStream.getTracks().forEach(track => track.stop());
      }
      scannerStream = null;
      els.scannerVideo.srcObject = null;
      scannerTorchOn = false;
      els.scannerTorch.hidden = true;
      els.scannerTorch.textContent = 'Encender flash';
    }

    function closeScanner() {
      stopScannerCamera();
      els.scannerModal.classList.remove('open');
      els.scannerModal.setAttribute('aria-hidden', 'true');
    }

    function handleScannedBarcode(rawCode) {
      const code = normalizeBarcode(rawCode);
      if (!code) return;
      const now = Date.now();
      if (code === scannerLastCode && now - scannerLastAt < 650) return;
      scannerLastCode = code;
      scannerLastAt = now;

      if (scannerMode === 'register') {
        stopScannerCamera();
        els.barcode.value = code;
        setScannerResult(`Código detectado: ${code}. Completa nombre, precio y stock para registrar el producto.`);
        els.name.focus();
        return;
      }

      const product = findProductByBarcode(code);
      if (!product) {
        showScannerAddOption(code);
        setScannerResult(`Código ${code} no está registrado. Puedes agregarlo al inventario.`, true);
        return;
      }

      hideScannerAddOption();
      if (product.stock <= 0) {
        setScannerResult(`${product.name}: ${money.format(product.price)}. No se agregó porque no tiene stock.`, true);
        return;
      }

      els.search.value = product.name;
      showingEmptyStock = false;
      addToCart(product.id);
      renderProducts();
      setScannerResult(`${product.name}: ${money.format(product.price)}. Agregado a la venta. Sigue escaneando.`);
    }

    async function scanLoop() {
      if (!scannerActive || !scannerDetector) return;
      try {
        const codes = await scannerDetector.detect(els.scannerVideo);
        if (codes.length) {
          handleScannedBarcode(codes[0].rawValue);
        }
      } catch {}
      scannerFrame = requestAnimationFrame(scanLoop);
    }

    async function openScanner(mode) {
      scannerMode = mode;
      stopScannerCamera();
      if (mode === 'sale') cart = [];
      els.scannerTitle.textContent = mode === 'register' ? 'Escanear para registrar' : 'Escanear producto';
      els.scannerSalePanel.style.display = mode === 'sale' ? 'grid' : 'none';
      hideScannerAddOption();
      renderCart();
      els.scannerModal.classList.add('open');
      els.scannerModal.setAttribute('aria-hidden', 'false');
      setScannerResult('Preparando cámara...');

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setScannerResult('Este navegador no permite abrir la cámara. Escribe el código manualmente.', true);
        return;
      }

      if (!('BarcodeDetector' in window)) {
        setScannerResult('Este navegador no tiene lector de códigos integrado. Escribe el código manualmente o prueba en Chrome Android.', true);
        return;
      }

      try {
        const preferredFormats = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'codabar', 'qr_code'];
        const supportedFormats = BarcodeDetector.getSupportedFormats ? await BarcodeDetector.getSupportedFormats() : preferredFormats;
        const formats = preferredFormats.filter(format => supportedFormats.includes(format));
        scannerDetector = formats.length ? new BarcodeDetector({ formats }) : new BarcodeDetector();
        scannerStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        els.scannerVideo.srcObject = scannerStream;
        await els.scannerVideo.play();
        setupScannerTorch();
        scannerActive = true;
        setScannerResult('Apunta al código de barras. Cuando lo detecte, mostrará el precio.');
        scannerLastCode = '';
        scannerLastAt = 0;
        scanLoop();
      } catch {
        setScannerResult('No se pudo abrir la cámara. Revisa el permiso de cámara o escribe el código manualmente.', true);
      }
    }

    els.productForm.addEventListener('submit', event => {
      event.preventDefault();
      if (saving) return;
      const barcode = normalizeBarcode(els.barcode.value);
      if (barcode && state.products.some(product => normalizeBarcode(product.barcode) === barcode)) {
        alert('Ese código de barras ya está registrado en otro producto.');
        return;
      }
      const product = {
        id: makeId(),
        name: els.name.value.trim(),
        category: els.category.value.trim() || 'General',
        price: Number(els.price.value),
        stock: Number(els.stock.value),
        barcode
      };
      if (!product.name || product.price < 0 || product.stock < 0) return;
      state.products.push(product);
      els.productForm.reset();
      render();
    });

    els.checkoutBtn.addEventListener('click', async () => {
      registerCurrentSale();
    });

    els.clearCartBtn.addEventListener('click', () => {
      cart = [];
      renderCart();
    });

    els.search.addEventListener('input', renderProducts);
    els.categoryFilter.addEventListener('change', renderProducts);
    els.emptyStockBtn.addEventListener('click', () => {
      showingEmptyStock = !showingEmptyStock;
      renderProducts();
    });

    els.exportBtn.addEventListener('click', () => {
      const rows = [['Producto', 'Categoría', 'Stock', 'Precio', 'Código de barras']];
      state.products.forEach(p => rows.push([p.name, p.category, p.stock, p.price, p.barcode || '']));
      const csv = rows.map(row => row.map(value => `"${String(value).replaceAll('"', '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'inventario-tienda.csv';
      link.click();
      URL.revokeObjectURL(link.href);
    });

    els.resetBtn.addEventListener('click', () => {
      if (saving) return;
      if (!confirm('¿Reiniciar productos y ventas?')) return;
      state = normalizeState({ products: starterProducts.map(p => ({ ...p, id: makeId() })), sales: [] });
      cart = [];
      render();
    });

    els.scanRegisterBtn.addEventListener('click', () => openScanner('register'));
    els.scanSaleBtn.addEventListener('click', () => openScanner('sale'));
    els.scannerAddProduct.addEventListener('click', () => {
      closeScanner();
      els.name.focus();
      els.productForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    els.scannerCheckout.addEventListener('click', registerCurrentSale);
    els.scannerClose.addEventListener('click', closeScanner);
    els.scannerTorch.addEventListener('click', toggleScannerTorch);
    els.scannerRetry.addEventListener('click', () => openScanner(scannerMode));
    els.scannerModal.addEventListener('click', event => {
      if (event.target === els.scannerModal) closeScanner();
    });

    els.receiptClose.addEventListener('click', closeReceipt);
    els.receiptPrint.addEventListener('click', printReceipt);
    els.receiptModal.addEventListener('click', event => {
      if (event.target === els.receiptModal) closeReceipt();
    });

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function init() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js').catch(() => {});
      }
      state = await loadState();
      savedSnapshot = JSON.stringify(state);
      render();
      setInterval(refreshSharedState, 5000);
      window.addEventListener('focus', refreshSharedState);
      window.addEventListener('online', refreshSharedState);
    }

    init();
  </script>
</body>
</html>
